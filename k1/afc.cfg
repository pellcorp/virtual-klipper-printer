# This is an AFC hardware add-on for the K1 virtual MCU. The package installs
# it as AFC/AFC_Virtual.cfg alongside the files deployed by install-afc.sh.
# It is deliberately not a real BoxTurtle motion profile: its rotation distance
# reduces the host-MCU pulse rate to one step/mm, which the K1 can schedule.
#
# Requires the AFC installer-managed [include AFC/*.cfg] in printer.cfg and
# AFC_Hardware.cfg. Do not use this file instead of AFC/AFC.cfg: that file
# provides AFC's macros. Disable any installer-generated physical unit file
# (for example AFC_ERB_Turtle_1.cfg) when using this virtual unit.

[mcu virtual]
serial: /tmp/virtual_afc_mcu

[AFC_BoxTurtle simulator]
hub: simulator
extruder: extruder

[AFC_hub simulator]
switch_pin: ^virtual:gpiochip7/gpio5
afc_bowden_length: 900
move_dis: 75
cut: False

[AFC_stepper lane1]
unit: simulator:1
step_pin: virtual:gpiochip7/gpio0
dir_pin: virtual:gpiochip7/gpio1
enable_pin: !virtual:gpiochip7/gpio2
microsteps: 1
rotation_distance: 200
long_moves_speed: 25
long_moves_accel: 50
short_moves_speed: 10
short_moves_accel: 25
max_move_dis: 50
dist_hub: 155
park_dist: 10
prep: ^virtual:gpiochip7/gpio3
load: ^virtual:gpiochip7/gpio4

[AFC_stepper lane2]
unit: simulator:2
step_pin: virtual:gpiochip7/gpio6
dir_pin: virtual:gpiochip7/gpio7
enable_pin: !virtual:gpiochip7/gpio8
microsteps: 1
rotation_distance: 200
long_moves_speed: 25
long_moves_accel: 50
short_moves_speed: 10
short_moves_accel: 25
max_move_dis: 50
dist_hub: 155
park_dist: 10
prep: ^virtual:gpiochip7/gpio9
load: ^virtual:gpiochip7/gpio10

[AFC_stepper lane3]
unit: simulator:3
step_pin: virtual:gpiochip7/gpio11
dir_pin: virtual:gpiochip7/gpio12
enable_pin: !virtual:gpiochip7/gpio13
microsteps: 1
rotation_distance: 200
long_moves_speed: 25
long_moves_accel: 50
short_moves_speed: 10
short_moves_accel: 25
max_move_dis: 50
dist_hub: 155
park_dist: 10
prep: ^virtual:gpiochip7/gpio14
load: ^virtual:gpiochip7/gpio15

[AFC_stepper lane4]
unit: simulator:4
step_pin: virtual:gpiochip7/gpio16
dir_pin: virtual:gpiochip7/gpio17
enable_pin: !virtual:gpiochip7/gpio18
microsteps: 1
rotation_distance: 200
long_moves_speed: 25
long_moves_accel: 50
short_moves_speed: 10
short_moves_accel: 25
max_move_dis: 50
dist_hub: 155
park_dist: 10
prep: ^virtual:gpiochip7/gpio19
load: ^virtual:gpiochip7/gpio20
