# Minimal, simulated AFC instance for the optional Dockerfile.afc image.
#
# It deliberately models four BoxTurtle-style lanes: enough to expose the AFC
# and AFC_stepper objects through Moonraker without adding a second MCU or
# hardware that the virtual-printer bridge must emulate.

[save_variables]
filename: /home/developer/printer_data/config/AFC/AFC.var

[print_stats]

[AFC]
VarFile: /home/developer/printer_data/config/AFC/AFC.var
long_moves_speed: 150
long_moves_accel: 250
short_moves_speed: 50
short_moves_accel: 300
short_move_dis: 10
enable_sensors_in_gui: False
load_to_hub: False
z_hop: 5
resume_speed: 120
resume_z_speed: 30
error_timeout: 36000
tool_cut: False
park: False
poop: False
kick: False
wipe: False
form_tip: False

[AFC_prep]
# Do not run AFC's hardware-dependent PREP sequence at simulator start-up.
enable: False

[AFC_form_tip]
cooling_tube_position: 35
cooling_tube_length: 10
cooling_moves: 4

[AFC_extruder extruder]

[AFC_BoxTurtle simulator]
hub: simulator
extruder: extruder

[AFC_hub simulator]
switch_pin: ^gpiochip7/gpio5
afc_bowden_length: 900
move_dis: 75
cut: False

[AFC_stepper lane1]
unit: simulator:1
step_pin: gpiochip7/gpio0
dir_pin: gpiochip7/gpio1
enable_pin: !gpiochip7/gpio2
microsteps: 16
rotation_distance: 4.65
dist_hub: 155
park_dist: 10
prep: ^gpiochip7/gpio3
load: ^gpiochip7/gpio4

[AFC_stepper lane2]
unit: simulator:2
step_pin: gpiochip7/gpio6
dir_pin: gpiochip7/gpio7
enable_pin: !gpiochip7/gpio8
microsteps: 16
rotation_distance: 4.65
dist_hub: 155
park_dist: 10
prep: ^gpiochip7/gpio9
load: ^gpiochip7/gpio10

[AFC_stepper lane3]
unit: simulator:3
step_pin: gpiochip7/gpio11
dir_pin: gpiochip7/gpio12
enable_pin: !gpiochip7/gpio13
microsteps: 16
rotation_distance: 4.65
dist_hub: 155
park_dist: 10
prep: ^gpiochip7/gpio14
load: ^gpiochip7/gpio15

[AFC_stepper lane4]
unit: simulator:4
step_pin: gpiochip7/gpio16
dir_pin: gpiochip7/gpio17
enable_pin: !gpiochip7/gpio18
microsteps: 16
rotation_distance: 4.65
dist_hub: 155
park_dist: 10
prep: ^gpiochip7/gpio19
load: ^gpiochip7/gpio20

[force_move]
enable_force_move: True
